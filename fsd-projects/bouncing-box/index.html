        background-size: cover;
        height: 100vh;
      }

      .board2 {
        background-image: url(https://static.wikia.nocookie.net/mario/images/1/19/SMB_World_1-2_NES_2.png/revision/latest?cb=20190815050442);

  </head>

  <body class="board">
    <!-- HTML for the box -->
    <div class="box">?</div>

    <script>
      (function () {
        "use strict";
        /* global jQuery */

        //////////////////////////////////////////////////////////////////
        /////////////////// SETUP DO NOT DELETE //////////////////////////
        //////////////////////////////////////////////////////////////////

        var box = jQuery(".box"); // reference to the HTML .box element
        var board = jQuery(".board"); // reference to the HTML .board element
        var boardWidth = board.width(); // the maximum X-Coordinate of the screen
        var boardHeight = board.height(); // the maximum Y-Coordinate

        // update the boardWidth variable when the window is resized
        jQuery(window).on("resize", function () {
          boardWidth = board.width();
        });

        // Every 50 milliseconds, call the update Function (see below)
        setInterval(update, 50);

        // Every time the box is clicked, call the handleBoxClick Function (see below)
        box.on("click", handleBoxClick);

        // moves the Box to a new position on the screen along the X-Axis
        function moveBoxTo(newPositionX, newPositionY) {
          box.css("left", newPositionX);
        }

        // changes the text displayed on the Box
        function changeBoxText(newText) {
          box.text(newText);
        }

        //////////////////////////////////////////////////////////////////
        /////////////////// YOUR CODE BELOW HERE /////////////////////////
        //////////////////////////////////////////////////////////////////

        // TODO 2 - Variable declarations
        var positionX = 20
        var positionY = 20
        var points = 0
        var speed = 10




        /**
         * This Function will be called 20 times/second.
         * Each time it is called, it should move the Box to a new location.
         * If the box drifts off the screen, turn it around!
         */
        function update() {
          positionX = positionX + speed;
          moveBoxTo(positionX, positionY);
          if (positionX > boardWidth){
            speed *= -1
          }

          if (positionX < 0){
            speed *= -1
          }

          if (positionY > boardHeight){
            speed *= -1
          }

          if (positionY < 0){
            speed *= -1
          }

        

          
        }

        /**
         * This Function will be called each time the box is clicked.
         * Each time it is called, it should perform each of the following actions:
         * - increase the points total
         * - increase the speed
         * - move the box to the left side of the screen.
         */
        function handleBoxClick() {
        positionX = 0;
        changeBoxText(points);
        points++;
        speed += 3;
        if (points >= 22){
          document.body.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0Y7fVraMBXj5MN7Zbe6moMu6_XHjNAdGAA3j1Ndb3gcjhd7q05b-Uz5M:https://i.pinimg.com/474x/36/60/07/366007265a46330d5e23638120393ce9.jpg&s=10')"; 
          document.body.style.backgroundSize = 'cover'; 
          document.body.style.backgroundPosition = 'center'; 
        }
        if (points === 22){
          alert('You reached 20! Next level!');
        }

        if (points >= 42){
          document.body.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgfd2Uw4tT1nXc0Nt7t1l8NvxBnD57RDYHqGIzQKuqLcwUo4BvQDxk1g:https://nesmaps.com/maps/SuperMarioBrothers/SuperMarioBrosMap1-3.png&s=10')"; 
          document.body.style.backgroundSize = 'cover'; 
          document.body.style.backgroundPosition = 'center'; 
        }
        if (points === 42){
          alert('You reached 40! Next level!');
        }

        if (points >= 62){
          document.body.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1w7jnICFLNx03IbhsJv_98mdiP3VrRxI91ESnXPA1ZKxw1x7kUBxtw5-q:https://wallpapercave.com/wp/wp4663787.jpg&s=10')"; 
          document.body.style.backgroundSize = 'cover'; 
          document.body.style.backgroundPosition = 'center'; 
        }
        if (points === 62){
          alert('You reached 60! Final level! Reach 80 to win!');
        }

        if (points === 82){
          alert('You reached 80! You win!')
        }

        if (points >= 102){
          document.body.style.backgroundImage = "url('https://i.ytimg.com/vi/n6hATiacDS8/maxresdefault.jpg')";
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundPosition = 'center';
        }
        
        if (points === 102){
          alert("Wow, I really didn't think you'd keep playing. BONUS LEVEL!!!");
        }




        }


        
      })();
    </script>
  </body>
</html>
